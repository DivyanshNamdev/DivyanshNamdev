name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: DivyanshNamdev
          outputs: |
            dist/github-contribution-grid-snake-dark.svg
      - uses: actions/checkout@v4
        with:
          ref: output
      - run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake-dark.svg output/
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: output
          commit_message: Generate snake
          file_pattern: output/*.svg
